<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat sheet · E-Business · Exam Lab</title>
<meta name="description" content="Every Chapter 5 Digital business strategy model on one page, with search and a self-test mode.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
<script>try{var t=localStorage.getItem('examlab:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script type="module" src="cheatsheet.js"></script>
<style>
  .tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .search { flex: 1 1 260px; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 17px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters .btn { min-height: 38px; padding: 4px 12px; font-size: 14px; box-shadow: 2px 2px 0 var(--shadow); }
  .filters .btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .sheet { columns: 3 300px; column-gap: 18px; }
  .cs { break-inside: avoid; margin: 0 0 18px; padding: 16px 18px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 3px 3px 0 var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .cs__head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .cs__head h2 { font-size: 19px; }
  .cs__l { flex: none; font: 600 12px "JetBrains Mono", monospace; color: var(--accent-text); text-decoration: none; }
  .cs__fig { font-size: 12px; color: var(--muted); margin-top: -6px; }
  .cs dl { margin: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 6px 12px; font-size: 14px; }
  .cs dt { font-weight: 600; }
  .cs dd { margin: 0; color: var(--muted); }
  .cs__tip { font-size: 13px; padding: 6px 10px; border-radius: 10px; background: var(--sun); color: var(--on-sun); font-weight: 600; }
  .testing .cs dd { cursor: pointer; color: transparent; border-radius: 6px; background: var(--tint); user-select: none; transition: color .2s ease, background .2s ease; }
  .testing .cs dd.is-shown { color: var(--muted); background: transparent; }
  mark { background: var(--sun); color: var(--on-sun); border-radius: 3px; }
  .empty { padding: 24px; text-align: center; border: 2px dashed var(--faint-line); border-radius: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="back-link" href="../index.html#courses"><span data-icon="left"></span> All courses</a>
    <button class="btn btn--ghost btn--icon" type="button" data-theme-toggle aria-label="Switch theme"></button>
  </header>
</div>
<main class="wrap stack" style="gap:20px">
  <div class="stack rise" style="gap:6px">
    <span class="eyebrow">E-Business · Chapter 5 · Revision</span>
    <h1 class="page-title">Cheat sheet</h1>
    <p class="lead">Every model in Chapter 5 on one page. Turn on <strong>Test me</strong> to hide the answers and tap to reveal them.</p>
  </div>
  <div class="tools">
    <label class="sr-only" for="q">Search the cheat sheet</label>
    <input class="search" id="q" type="search" placeholder="Search: SWOT, P1, extraprise…" autocomplete="off">
    <button class="switch" type="button" role="switch" aria-checked="false" id="test">
      <span class="switch__track"><span class="switch__knob"></span></span>
      Test me
    </button>
  </div>
  <div class="filters" role="group" aria-label="Filter by lesson" id="filters"></div>
  <p class="muted" id="count" aria-live="polite"></p>
  <div class="sheet" id="sheet"></div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>Based on Chaffey, Digital Business &amp; E-Commerce Management, Chapter 5</span>
    <a href="case.html">Case-study final</a>
  </div>
</footer>
</body>
</html>
