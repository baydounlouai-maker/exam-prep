<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relationships · Java UML · Exam Lab</title>
<meta name="description" content="Lesson 3: the six UML relationship arrows, animated, with the matching Java code.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
<script>try{var t=localStorage.getItem('examlab:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script type="module" src="relationships.js"></script>
<style>
  .picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .rel-chip {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 80px; padding: 12px 14px;
    border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--text);
    box-shadow: 2px 2px 0 var(--shadow); font-weight: 600; text-align: left; cursor: pointer; transition: all .2s ease; position: relative;
  }
  .rel-chip:hover { transform: translateY(-2px); }
  .rel-chip .arrow { width: 110px; color: currentColor; }
  .rel-chip[aria-selected="true"] { background: var(--accent); color: var(--on-accent); box-shadow: 4px 4px 0 var(--shadow); transform: translateY(-3px); --hollow: var(--accent); }
  .rel-chip__seen { position: absolute; top: 8px; right: 10px; color: var(--accent-text); }
  .rel-chip[aria-selected="true"] .rel-chip__seen { color: var(--on-accent); }
  .stage-card { padding: 68px clamp(14px, 4vw, 48px) 40px; display: flex; flex-direction: column; gap: 36px; box-shadow: 6px 6px 0 var(--shadow); }
  .say { font-family: "Space Grotesk", sans-serif; font-size: clamp(22px, 3vw, 30px); font-weight: 500; letter-spacing: -0.02em; }
  .say .hl { font-weight: 700; }
  .facts { display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch; }
  .facts > .code { flex: 1 1 440px; }
  .facts > .panel { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .fact { display: flex; gap: 12px; align-items: baseline; }
  .fact__k { flex: none; width: 52px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="back-link" href="../index.html#courses"><span data-icon="left"></span> All topics</a>
    <div class="row" style="gap:10px">
      <span class="chip" id="seen-chip">Seen 0 / 6</span>
      <button class="btn btn--ghost btn--icon" type="button" data-theme-toggle aria-label="Switch theme"></button>
    </div>
  </header>
</div>

<main class="wrap stack" style="gap:28px">
  <div class="stack rise" style="gap:6px">
    <span class="eyebrow">Java UML · Lesson 3</span>
    <h1 class="page-title">Six arrows, six meanings</h1>
    <p class="lead">Pick an arrow. Watch it draw. Read the Java.</p>
  </div>

  <div class="picker rise rise-1" role="tablist" aria-label="Relationship types" id="picker"></div>

  <div id="stage" aria-live="polite"></div>

  <div class="sticky">
    <strong>Diamond rule</strong>
    The diamond sits at the whole. Hollow: parts survive alone. Filled: parts die with it.
  </div>

  <section class="stack" id="check" style="gap:16px;padding-top:8px">
    <div class="row row--between" style="align-items:baseline">
      <h2 class="section-title">Mini quiz</h2>
      <span class="muted" id="check-count"></span>
    </div>
    <div class="card card--pad stack" id="check-body" style="gap:20px"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>Exam Lab · Java UML</span>
    <a href="quiz.html">Ready? Boss quiz</a>
  </div>
</footer>
</body>
</html>
